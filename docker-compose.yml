services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: qna_dev
      MYSQL_USER: qna
      MYSQL_PASSWORD: qna123
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3310:3306"
    restart: unless-stopped
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qna-backend
    depends_on:
      - mysql
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: qna_dev
      DB_USER: qna
      DB_PASSWORD: qna123
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: "http://localhost:8080"
    container_name: qna-frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  mysql_data:
