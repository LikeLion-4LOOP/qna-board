name: Deploy to EC2 (Jar)

on:
  push:
    branches: [ "dev" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build (Gradle)
        run: ./gradlew clean build -x test

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2.key
          chmod 600 ~/.ssh/ec2.key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload jar to EC2
        run: |
          JAR_PATH=$(ls build/libs/*.jar | head -n 1)
          echo "Uploading: $JAR_PATH"
          scp -i ~/.ssh/ec2.key "$JAR_PATH" "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ec2-user/app/app.jar"

      - name: Restart app on EC2
        run: |
          ssh -i ~/.ssh/ec2.key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "bash /home/ec2-user/app/deploy.sh"