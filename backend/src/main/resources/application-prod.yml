spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:qna_prod}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USER:qna}
    password: ${DB_PASSWORD:qna123}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

logging:
  level:
    root: info
    com.example.qnaboard: info

jwt:
  secret: ${JWT_SECRET}
  access-exp-ms: ${JWT_ACCESS_EXP_MS:900000}
  refresh-exp-ms: ${JWT_REFRESH_EXP_MS:1209600000}
